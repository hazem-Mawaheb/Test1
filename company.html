<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
بوابة الشركات
</title>

css/style.css

</head>

<body>

<h1>
بوابة أصحاب الأعمال
</h1>

https://formspree.io/f/PUT_YOUR_ID

<input
name="company_name"
placeholder="اسم الشركة"
required>

<input
name="mobile_no"
placeholder="رقم الموبايل">

<input
name="whatsapp_no"
placeholder="رقم الواتساب">

<input
name="email_id"
placeholder="البريد الإلكتروني">

<input
name="site_work_location"
placeholder="موقع العمل">

<select name="man_power_type">

<option>
الإدارة العليا
</option>

<option>
إداريين
</option>

<option>
فنيين
</option>

<option>
عمالة ماهرة
</option>

<option>
عمالة غير ماهرة
</option>

</select>

<input
name="position"
placeholder="المسمى الوظيفي">

<input
name="quantity"
type="number"
placeholder="العدد المطلوب">

<input
name="visa_status"
placeholder="نوع التأشيرة">

<input
name="gross_salary"
placeholder="الراتب">

<input
name="other_benefits"
placeholder="الامتيازات">

<input
name="working_hours"
placeholder="عدد ساعات العمل">

<input
name="holiday_days_quantity"
placeholder="عدد أيام الإجازة">

<button type="submit">

إرسال الطلب

</button>

</form>

</body>

</html>
